<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        h1 {
            font-size: 20px;
        }
        canvas {
            border: 1px solid #999;
            background-color: black;
            display: block;
        }
        #instrucoes {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }
        #painelFimDeJogo {
            display: none;
            margin-top: 14px;
            padding: 16px;
            border: 1px solid #ccc;
            background-color: #fff;
            max-width: 300px;
        }
        #mensagemFim {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 12px 0;
        }
        #btnJogarNovamente {
            font-size: 16px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Pong</h1>

    <canvas id="canvas" width="600" height="600"></canvas>

    <div id="painelFimDeJogo">
        <p id="mensagemFim"></p>
        <button id="btnJogarNovamente">Jogar Novamente</button>
    </div>

    <p id="instrucoes">
        Jogador da esquerda (verde): teclas <strong>W</strong> (sobe) /
        <strong>S</strong> (desce).<br>
        Jogador da direita (azul): setas <strong>↑</strong> (sobe) /
        <strong>↓</strong> (desce).
    </p>

    <script src="m3.js"></script>
    <script src="main.js"></script>

</body>
</html>
